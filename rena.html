<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vismay — Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --parchment:#e9d8b0; --parchment-d:#cdb582; --ink:#2b1a0e; --gold:#c9a24b;
    --gold-l:#f0d68a; --crimson:#6e1423; --umber:#1a0f08;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--umber);color:var(--parchment);font-family:'Cormorant Garamond',serif}
  #stage{position:fixed;inset:0}
  canvas{display:block}

  /* HUD */
  .title{position:fixed;top:22px;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;z-index:5;width:90%}
  .title h1{font-family:'Cinzel',serif;font-weight:700;letter-spacing:.35em;font-size:clamp(1.1rem,3vw,2rem);color:var(--gold-l);text-shadow:0 2px 12px #000}
  .title p{font-family:'IM Fell English',serif;font-style:italic;font-size:clamp(.85rem,1.8vw,1.1rem);color:var(--parchment-d);margin-top:4px}
  .title .rule{height:1px;width:220px;margin:8px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}

  .nav{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:5;flex-wrap:wrap;justify-content:center;padding:0 10px}
  .nav button{font-family:'Cinzel',serif;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;
    background:linear-gradient(#3a2412,#241408);color:var(--gold-l);border:1px solid var(--gold);
    padding:9px 14px;cursor:pointer;transition:.25s;box-shadow:0 0 0 2px #0006 inset}
  .nav button:hover,.nav button.active{background:var(--crimson);color:#fff;box-shadow:0 0 14px #c9a24b88}

  .hint{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);font-family:'IM Fell English',serif;font-style:italic;color:var(--parchment-d);font-size:.95rem;z-index:5;pointer-events:none;opacity:.85;text-align:center;width:90%}

  /* Scroll panel */
  #panel{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:10;background:radial-gradient(#0009,#000d)}
  #panel.open{display:flex;animation:fade .5s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .scroll{position:relative;width:min(760px,92vw);max-height:84vh;overflow:auto;padding:46px 54px 40px;color:var(--ink);
    background:
      radial-gradient(ellipse at 20% 10%,#f7ecc9 0%,transparent 55%),
      radial-gradient(ellipse at 85% 90%,#b99b5d55 0%,transparent 60%),
      linear-gradient(#e8d6a8,#d9c28c);
    border:2px solid #7a5a22;box-shadow:0 0 0 6px #3a2412,0 0 0 8px var(--gold),0 30px 80px #000}
  .scroll::before,.scroll::after{content:"❦";position:absolute;left:50%;transform:translateX(-50%);color:#7a5a22;font-size:1.3rem}
  .scroll::before{top:10px}.scroll::after{bottom:8px}
  .scroll h2{font-family:'Cinzel',serif;font-size:clamp(1.3rem,3vw,1.9rem);letter-spacing:.2em;text-align:center;color:var(--crimson);text-transform:uppercase}
  .scroll .sub{font-family:'IM Fell English',serif;font-style:italic;text-align:center;margin:4px 0 20px;color:#5a3d1a}
  .scroll p,.scroll li{font-size:1.2rem;line-height:1.5}
  .scroll p::first-letter{}
  .scroll .drop::first-letter{font-family:'Cinzel',serif;font-size:3.2rem;float:left;line-height:.85;padding:6px 8px 0 0;color:var(--crimson)}
  .scroll ul{list-style:none;margin-top:10px}
  .scroll li{padding:6px 0 6px 26px;position:relative;border-bottom:1px dotted #7a5a2255}
  .scroll li::before{content:"✠";position:absolute;left:0;color:var(--crimson);font-size:.9rem;top:9px}
  .scroll b{color:var(--crimson);font-weight:600}
  .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;justify-content:center}
  .tags span{font-family:'Cinzel',serif;font-size:.7rem;letter-spacing:.12em;border:1px solid #7a5a22;padding:5px 10px;background:#f4e7c1;color:var(--ink)}
  .close{position:absolute;top:10px;right:14px;background:none;border:none;font-size:1.8rem;color:var(--crimson);cursor:pointer;font-family:'Cinzel',serif;z-index:2}
  .close:hover{color:#000}
  .portrait{float:right;width:150px;height:190px;object-fit:cover;object-position:center 20%;margin:0 0 10px 18px;border:3px solid #7a5a22;border-radius:50%/42%;box-shadow:0 0 0 3px #3a2412,0 0 0 5px var(--gold),0 6px 18px #0008;filter:sepia(.25) contrast(1.05)}
  a.link{color:var(--crimson);text-decoration:none;border-bottom:1px solid var(--crimson)}

  #loader{position:fixed;inset:0;background:var(--umber);display:flex;align-items:center;justify-content:center;z-index:50;font-family:'Cinzel',serif;color:var(--gold-l);letter-spacing:.4em;transition:opacity 1s}
  #loader.hide{opacity:0;pointer-events:none}
</style>
</head>

stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x120a05);

/* ---------- procedural textures ---------- */
function marbleTexture(){
  const c=document.createElement('canvas');c.width=c.height=512;const g=c.getContext('2d');
  g.fillStyle='#e8dcc0';g.fillRect(0,0,512,512);
  for(let i=0;i<60;i++){
    g.strokeStyle=`rgba(${90+Math.random()*40},${70+Math.random()*30},${50},${.05+Math.random()*.12})`;
    g.lineWidth=Math.random()*2+.3;g.beginPath();
    let x=Math.random()*512,y=Math.random()*512;g.moveTo(x,y);
    for(let j=0;j<6;j++){x+=Math.random()*120-60;y+=Math.random()*120-60;g.lineTo(x,y)}
    g.stroke();
  }
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;
}
function checkerFloor(){
  const c=document.createElement('canvas');c.width=c.height=1024;const g=c.getContext('2d');
  const n=8,s=1024/n;
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){
    g.fillStyle=(i+j)%2?'#2a1810':'#d8c79e';g.fillRect(i*s,j*s,s,s);
    g.strokeStyle='#0004';g.strokeRect(i*s,j*s,s,s);
  }
  // marble veins
  for(let i=0;i<120;i++){g.strokeStyle='rgba(120,90,50,.08)';g.beginPath();let x=Math.random()*1024,y=Math.random()*1024;g.moveTo(x,y);g.lineTo(x+Math.random()*200-100,y+Math.random()*200-100);g.stroke()}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(4,4);t.anisotropy=8;return t;
}
function parchmentTexture(w=512,h=640,text){
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
  const gr=g.createRadialGradient(w/2,h/2,40,w/2,h/2,h*.75);
  gr.addColorStop(0,'#f1e2b8');gr.addColorStop(1,'#b8974f');g.fillStyle=gr;g.fillRect(0,0,w,h);
  for(let i=0;i<500;i++){g.fillStyle=`rgba(90,60,20,${Math.random()*.06})`;g.beginPath();g.arc(Math.random()*w,Math.random()*h,Math.random()*18,0,7);g.fill()}
  return c;
}

/* ---------- floor, ceiling, back ---------- */
const floor = new THREE.Mesh(new THREE.CircleGeometry(40,64), new THREE.MeshStandardMaterial({map:checkerFloor(),roughness:.35,metalness:.1}));
floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);

// domed ceiling
const dome = new THREE.Mesh(new THREE.SphereGeometry(30,48,24,0,Math.PI*2,0,Math.PI/2),
  new THREE.MeshStandardMaterial({color:0x3a2412,side:THREE.BackSide,roughness:.9}));
dome.position.y=9;scene.add(dome);

// dome coffers (rings of gold)
for(let r=3;r<=24;r+=3.5){
  const ring = new THREE.Mesh(new THREE.TorusGeometry(r,.08,8,80),new THREE.MeshStandardMaterial({color:0xc9a24b,metalness:.9,roughness:.3,emissive:0x2a1d05}));
  const h = Math.sqrt(Math.max(0,30*30-r*r));
  ring.position.y=9+h-.2;ring.rotation.x=Math.PI/2;scene.add(ring);
}

/* ---------- columns & arches ---------- */
const marble = new THREE.MeshStandardMaterial({map:marbleTexture(),roughness:.45,metalness:.05});
const gold = new THREE.MeshStandardMaterial({color:0xc9a24b,metalness:.95,roughness:.25,emissive:0x2a1c04});

function column(x,z){
  const g=new THREE.Group();
  const base=new THREE.Mesh(new THREE.CylinderGeometry(.75,.85,.4,24),marble);base.position.y=.2;
  const plinth=new THREE.Mesh(new THREE.BoxGeometry(1.8,.3,1.8),marble);plinth.position.y=.15;
  const shaft=new THREE.Mesh(new THREE.CylinderGeometry(.55,.65,8,24),marble);shaft.position.y=4.5;
  // fluting
  for(let i=0;i<12;i++){
    const a=i/12*Math.PI*2;
    const f=new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,7.8,6),new THREE.MeshStandardMaterial({color:0xb9a47a,roughness:.7}));
    f.position.set(Math.cos(a)*.6,4.5,Math.sin(a)*.6);g.add(f);
  }
  const cap=new THREE.Mesh(new THREE.CylinderGeometry(.85,.55,.5,24),gold);cap.position.y=8.75;
  const abacus=new THREE.Mesh(new THREE.BoxGeometry(1.7,.25,1.7),marble);abacus.position.y=9.1;
  // volutes
  for(const s of[-1,1]){const v=new THREE.Mesh(new THREE.TorusGeometry(.22,.07,8,16),gold);v.position.set(s*.75,8.75,0);g.add(v)}
  g.add(base,plinth,shaft,cap,abacus);
  g.position.set(x,0,z);g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});
  scene.add(g);
}
const R_COL=16;
for(let i=0;i<16;i++){const a=i/16*Math.PI*2;column(Math.cos(a)*R_COL,Math.sin(a)*R_COL)}

// ring architrave
const arch=new THREE.Mesh(new THREE.TorusGeometry(R_COL,.35,12,96),marble);
arch.rotation.x=Math.PI/2;arch.position.y=9.4;scene.add(arch);
const archGold=new THREE.Mesh(new THREE.TorusGeometry(R_COL,.1,8,96),gold);
archGold.rotation.x=Math.PI/2;archGold.position.y=9.1;scene.add(archGold);

/* ---------- centrepiece: armillary sphere + Vitruvian rings ---------- */
const centre=new THREE.Group();scene.add(centre);
const pedestal=new THREE.Mesh(new THREE.CylinderGeometry(1.1,1.4,1.2,32),marble);pedestal.position.y=.6;pedestal.castShadow=true;centre.add(pedestal);
const pedGold=new THREE.Mesh(new THREE.TorusGeometry(1.15,.06,8,40),gold);pedGold.rotation.x=Math.PI/2;pedGold.position.y=1.2;centre.add(pedGold);

const armillary=new THREE.Group();armillary.position.y=3.2;centre.add(armillary);
const ringMat=new THREE.MeshStandardMaterial({color:0xd7b25c,metalness:1,roughness:.2,emissive:0x3a2705});
const rings=[];
[[1.6,0,0],[1.4,Math.PI/2,0],[1.2,Math.PI/4,Math.PI/3],[1.0,-Math.PI/3,Math.PI/5]].forEach(([r,rx,ry],i)=>{
  const t=new THREE.Mesh(new THREE.TorusGeometry(r,.035,12,96),ringMat);t.rotation.set(rx,ry,0);armillary.add(t);rings.push(t);
});
// Vitruvian circle & square (flat, on a thin vertical plane)
const vit=new THREE.Group();armillary.add(vit);
const circ=new THREE.Mesh(new THREE.TorusGeometry(1.9,.025,8,96),ringMat);vit.add(circ);
const sqPts=[[-1.35,-1.35],[1.35,-1.35],[1.35,1.35],[-1.35,1.35],[-1.35,-1.35]].map(p=>new THREE.Vector3(p[0],p[1],0));
const sq=new THREE.Line(new THREE.BufferGeometry().setFromPoints(sqPts),new THREE.LineBasicMaterial({color:0xd7b25c}));vit.add(sq);
// core orb — glowing "knowledge"
const core=new THREE.Mesh(new THREE.IcosahedronGeometry(.45,1),new THREE.MeshStandardMaterial({color:0x8a1a2e,emissive:0x5a0c1c,emissiveIntensity:1.2,roughness:.3,metalness:.4,flatShading:true}));
armillary.add(core);
const coreLight=new THREE.PointLight(0xffb060,2.2,18,1.6);coreLight.position.y=3.2;centre.add(coreLight);

/* ---------- framed paintings ---------- */
const paintings=[];
const R_FRAME=10.5;

function paintingCanvas(sec){
  const w=512,h=680;const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
  const draw=()=>{
    // canvas "oil" background
    const bg=g.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#2a1a10');bg.addColorStop(1,'#120a05');
    g.fillStyle=bg;g.fillRect(0,0,w,h);
    // chiaroscuro glow
    const rg=g.createRadialGradient(w/2,h*.42,10,w/2,h*.42,h*.55);
    rg.addColorStop(0,'rgba(240,200,120,.55)');rg.addColorStop(.5,'rgba(150,80,30,.25)');rg.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=rg;g.fillRect(0,0,w,h);
    // craquelure
    g.strokeStyle='rgba(0,0,0,.25)';g.lineWidth=.6;
    for(let i=0;i<70;i++){g.beginPath();let x=Math.random()*w,y=Math.random()*h;g.moveTo(x,y);for(let j=0;j<4;j++){x+=Math.random()*50-25;y+=Math.random()*50-25;g.lineTo(x,y)}g.stroke()}
    if(sec.id==='about'&&portraitImg.complete&&portraitImg.naturalWidth){
      const cx=w/2,cy=h*.42,rx=150,ry=196;
      g.save();g.beginPath();g.ellipse(cx,cy,rx,ry,0,0,7);g.clip();
      const iw=portraitImg.naturalWidth,ih=portraitImg.naturalHeight,sc=Math.max(rx*2/iw,ry*2/ih);
      g.drawImage(portraitImg,cx-iw*sc/2,cy-ih*sc/2+10,iw*sc,ih*sc);
      g.globalCompositeOperation='multiply';g.fillStyle='#7d5a30';g.fillRect(0,0,w,h);g.globalCompositeOperation='source-over';   // warm oil-varnish tint
      const vg=g.createRadialGradient(cx,cy,ry*.5,cx,cy,ry*1.05);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(20,8,0,.7)');
      g.fillStyle=vg;g.fillRect(0,0,w,h);g.restore();
      g.strokeStyle='#d7b25c';g.lineWidth=7;g.beginPath();g.ellipse(cx,cy,rx+4,ry+4,0,0,7);g.stroke();
      g.lineWidth=2;g.beginPath();g.ellipse(cx,cy,rx+16,ry+16,0,0,7);g.stroke();
    } else {
    // emblem: roman numeral in gold medallion
    g.save();g.translate(w/2,h*.42);
    g.strokeStyle='#d7b25c';g.lineWidth=5;g.beginPath();g.arc(0,0,128,0,7);g.stroke();
    g.lineWidth=2;g.beginPath();g.arc(0,0,114,0,7);g.stroke();
    for(let i=0;i<24;i++){const a=i/24*Math.PI*2;g.beginPath();g.moveTo(Math.cos(a)*128,Math.sin(a)*128);g.lineTo(Math.cos(a)*142,Math.sin(a)*142);g.stroke()}
    g.fillStyle='#f0d68a';g.font='700 100px "Times New Roman", Georgia, serif';g.textAlign='center';g.textBaseline='middle';
    g.shadowColor='#000';g.shadowBlur=14;g.fillText(sec.roman,0,6);
    g.restore();
    }
    // title banner
    g.fillStyle='rgba(20,10,4,.78)';g.fillRect(40,h-150,w-80,100);
    g.strokeStyle='#c9a24b';g.lineWidth=2;g.strokeRect(40,h-150,w-80,100);
    g.fillStyle='#f0d68a';g.textAlign='center';g.textBaseline='alphabetic';g.shadowBlur=0;
    g.font='600 40px Cinzel, serif';g.fillText(sec.label.toUpperCase(),w/2,h-97);
    g.fillStyle='#cdb582';g.font='italic 24px "IM Fell English", serif';g.fillText(sec.title,w/2,h-64);
  };
  draw();
  return {canvas:c,redraw:draw};
}

SECTIONS.forEach((sec,i)=>{
  const a=(i/SECTIONS.length)*Math.PI*2;
  const grp=new THREE.Group();
  const {canvas,redraw}=paintingCanvas(sec);
  const tex=new THREE.CanvasTexture(canvas);tex.anisotropy=8;
  document.fonts.ready.then(()=>{redraw();tex.needsUpdate=true});
  if(sec.id==='about'){const done=()=>{redraw();tex.needsUpdate=true};if(portraitImg.complete&&portraitImg.naturalWidth)done();else portraitImg.addEventListener('load',done)}

  const W=3.2,H=4.2;
  const art=new THREE.Mesh(new THREE.PlaneGeometry(W,H),new THREE.MeshStandardMaterial({map:tex,roughness:.7}));
  art.position.z=.12;art.userData.sectionIndex=i;grp.add(art);
  // frame (4 gilded bars + inner bevel)
  const fT=.28,d=.24;
  const bars=[[W+fT*2,fT,0,H/2+fT/2],[W+fT*2,fT,0,-H/2-fT/2],[fT,H,-W/2-fT/2,0],[fT,H,W/2+fT/2,0]];
  bars.forEach(([bw,bh,bx,by])=>{
    const m=new THREE.Mesh(new THREE.BoxGeometry(bw,bh,d),gold);m.position.set(bx,by,.1);m.castShadow=true;grp.add(m);
    const inner=new THREE.Mesh(new THREE.BoxGeometry(bw*.9,bh*.5,d+.06),new THREE.MeshStandardMaterial({color:0x8a6a22,metalness:.8,roughness:.4}));
    inner.position.set(bx,by,.1);grp.add(inner);
  });
  // corner rosettes
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sy])=>{
    const r=new THREE.Mesh(new THREE.SphereGeometry(.2,12,12),gold);r.position.set(sx*(W/2+fT/2),sy*(H/2+fT/2),.24);grp.add(r);
  });
  // backing
  const back=new THREE.Mesh(new THREE.BoxGeometry(W,H,.1),new THREE.MeshStandardMaterial({color:0x1a0f08}));back.position.z=.02;grp.add(back);

  // spotlight above, aimed at painting
  const sp=new THREE.SpotLight(0xffd699,3.2,14,Math.PI/6,.55,1.2);
  sp.position.set(0,H/2+3,3.5);sp.target=art;sp.castShadow=false;grp.add(sp);
  // little gilt lamp
  const lamp=new THREE.Mesh(new THREE.CylinderGeometry(.55,.1,.15,16,1,true),new THREE.MeshStandardMaterial({color:0xc9a24b,metalness:.9,roughness:.3,side:THREE.DoubleSide}));
  lamp.position.set(0,H/2+.65,.5);lamp.rotation.x=-.3;grp.add(lamp);

  // stand/plinth under the painting
  const plinth=new THREE.Mesh(new THREE.BoxGeometry(2.2,.5,.9),marble);plinth.position.set(0,-H/2-.55,.2);plinth.castShadow=true;grp.add(plinth);

  grp.position.set(Math.sin(a)*R_FRAME,H/2+.9,-Math.cos(a)*R_FRAME);
  grp.lookAt(0,H/2+.9,0);
  grp.userData={angle:a,i};
  scene.add(grp);paintings.push({grp,art,angle:a,baseY:H/2+.9});
});

const BLK='#1b0f09',RED='#a8451b',CRM='#ead9b4';
function meander(g,y){
  g.save();g.strokeStyle=BLK;g.lineWidth=4;g.lineJoin='miter';
  const s=26;
  for(let x=28;x<1380-s*2;x+=s*2){
    g.beginPath();g.moveTo(x,y+s);g.lineTo(x,y);g.lineTo(x+s*1.6,y);g.lineTo(x+s*1.6,y+s*.75);g.lineTo(x+s*.6,y+s*.75);g.lineTo(x+s*.6,y+s*.3);g.lineTo(x+s*1.1,y+s*.3);g.stroke();
  }
  g.fillStyle=BLK;g.fillRect(24,y-8,1352,5);g.fillRect(24,y+s+4,1352,5);
  g.restore();
}
function poseFig(g,x,y,h,P,o={}){
  const f=o.flip?-1:1,X=p=>x+f*p[0]*h,Y=p=>y-p[1]*h;
  g.save();g.lineCap='round';g.lineJoin='round';g.strokeStyle=BLK;g.fillStyle=BLK;
  const line=(pts,w)=>{g.lineWidth=w*h;g.beginPath();pts.forEach((p,i)=>i?g.lineTo(X(p),Y(p)):g.moveTo(X(p),Y(p)));g.stroke()};
  if(o.dress){
    g.beginPath();g.moveTo(X([-.09,.62]),Y([-.09,.62]));g.lineTo(X([.09,.62]),Y([.09,.62]));
    g.lineTo(X([.19,.03]),Y([.19,.03]));g.lineTo(X([-.19,.03]),Y([-.19,.03]));g.closePath();g.fill();
  }else(P.legs||[]).forEach(l=>line(l,.085));
  line([P.neck,P.hip],.16);
  (P.arms||[]).forEach(a=>line(a,.06));
  g.beginPath();g.arc(X(P.head),Y(P.head),.07*h,0,7);g.fill();
  g.beginPath();g.moveTo(X(P.head)+f*.05*h,Y(P.head)-.012*h);g.lineTo(X(P.head)+f*.11*h,Y(P.head)+.02*h);g.lineTo(X(P.head)+f*.05*h,Y(P.head)+.035*h);g.fill();
  if(o.hair){g.beginPath();g.moveTo(X(P.head)-f*.05*h,Y(P.head));g.quadraticCurveTo(X(P.head)-f*.14*h,Y(P.head)+.08*h,X(P.head)-f*.1*h,Y(P.head)+.2*h);g.lineWidth=.05*h;g.stroke()}
  g.fillStyle=CRM;g.beginPath();g.arc(X(P.head)+f*.03*h,Y(P.head)-.005*h,.012*h,0,7);g.fill();
  g.strokeStyle=RED;g.lineWidth=1.6;
  g.beginPath();g.moveTo(X(P.neck)-f*.03*h,Y(P.neck)+.04*h);g.lineTo(X(P.hip)-f*.03*h,Y(P.hip)+.04*h);g.stroke();
  if(o.dress){for(let i=0;i<5;i++){g.beginPath();g.moveTo(X([-.1+i*.05,.5]),Y([0,.5]));g.lineTo(X([-.15+i*.075,.06]),Y([0,.06]));g.stroke()}}
  g.restore();
}

function horse(g,x,y,s,ph=0){
  g.save();g.fillStyle=BLK;g.strokeStyle=BLK;g.lineCap='round';g.lineJoin='round';
  g.beginPath();g.ellipse(x,y,s*.95,s*.4,0,0,7);g.fill();

  g.beginPath();g.ellipse(x+s*1.38,y-s*.9,s*.32,s*.13,.55,0,7);g.fill();
  g.beginPath();g.moveTo(x+s*1.18,y-s*1.02);g.lineTo(x+s*1.2,y-s*1.22);g.lineTo(x+s*1.28,y-s*1.02);g.fill();
  const sw=Math.sin(ph)*.25;
  const L=(hx,k,f)=>{g.lineWidth=s*.14;g.beginPath();g.moveTo(x+hx*s,y+s*.2);g.lineTo(x+(hx+k)*s,y+s*.7);g.lineTo(x+(hx+f)*s,y+s*1.12);g.stroke()};
  L(.65,.2+sw,.45+sw);L(.55,-.05+sw,-.1);L(-.65,-.15-sw,-.45-sw);L(-.55,.1,.25-sw);
  g.lineWidth=s*.12;g.beginPath();g.moveTo(x-s*.92,y-s*.1);g.quadraticCurveTo(x-s*1.4,y+s*.1,x-s*1.35,y+s*.7);g.stroke();

  for(let i=0;i<7;i++){g.beginPath();g.moveTo(x+s*(.6+i*.09),y-s*(.25+i*.1));g.lineTo(x+s*(.7+i*.09),y-s*(.2+i*.1)+4);g.stroke()}

  g.restore();

  for(let i=0;i<2200;i++){g.fillStyle=`rgba(70,25,8,${Math.random()*.1})`;g.fillRect(Math.random()*1400,Math.random()*560,2,2)}
  meander(g,22);meander(g,488-26);
  g.save();g.beginPath();g.rect(0,80,1400,370);g.clip();scene(g);g.restore();
  g.fillStyle=BLK;g.textAlign='center';g.font='600 26px Cinzel, serif';g.fillText(title.toUpperCase(),700,548);
  g.strokeStyle=BLK;g.lineWidth=5;g.strokeRect(6,6,1388,548);
}
FRIEZE.forEach(([name,fn],i)=>{
  const c=document.createElement('canvas');c.width=1400;c.height=560;
  const tex=new THREE.CanvasTexture(c);tex.anisotropy=8;
  const paint=()=>{vasePaint(c,name,fn);tex.needsUpdate=true};paint();document.fonts.ready.then(paint);
  const W=6.6,H=2.64,grp=new THREE.Group();
  const pan=new THREE.Mesh(new THREE.PlaneGeometry(W,H),new THREE.MeshStandardMaterial({map:tex,emissiveMap:tex,emissive:0xffffff,emissiveIntensity:.5,roughness:.8}));
  pan.position.z=.1;grp.add(pan);
  const ft=.22;
  [[W+ft*2,ft,0,H/2+ft/2],[W+ft*2,ft,0,-H/2-ft/2],[ft,H,-W/2-ft/2,0],[ft,H,W/2+ft/2,0]].forEach(([bw,bh,bx,by])=>{
    const m=new THREE.Mesh(new THREE.BoxGeometry(bw,bh,.22),gold);m.position.set(bx,by,.08);m.castShadow=true;grp.add(m)});
  const a=((i+.5)/5)*Math.PI*2;
  grp.position.set(Math.sin(a)*15.2,8.0,-Math.cos(a)*15.2);
  grp.lookAt(0,8.0,0);scene.add(grp);
});

/* ---------- lighting ---------- */
scene.add(new THREE.AmbientLight(0x4a3322,.55));
const hemi=new THREE.HemisphereLight(0xffe0b0,0x201008,.35);scene.add(hemi);
const key=new THREE.DirectionalLight(0xffd9a0,.5);key.position.set(8,18,6);key.castShadow=true;
key.shadow.mapSize.set(1024,1024);key.shadow.camera.left=-20;key.shadow.camera.right=20;key.shadow.camera.top=20;key.shadow.camera.bottom=-20;scene.add(key);

/* ---------- candle flames (flickering) ---------- */
const candles=[];
for(let i=0;i<16;i++){
  const a=(i+.5)/16*Math.PI*2;
  const x=Math.cos(a)*13.2,z=Math.sin(a)*13.2;
  const stick=new THREE.Mesh(new THREE.CylinderGeometry(.07,.09,1.8,10),new THREE.MeshStandardMaterial({color:0xf0e2bc,roughness:.8}));
  stick.position.set(x,.9,z);scene.add(stick);
  const stand=new THREE.Mesh(new THREE.CylinderGeometry(.28,.34,.15,14),gold);stand.position.set(x,.08,z);scene.add(stand);
  const flame=new THREE.Mesh(new THREE.SphereGeometry(.11,10,10),new THREE.MeshBasicMaterial({color:0xffc060}));
  flame.scale.set(1,1.8,1);flame.position.set(x,2,z);scene.add(flame);
  if(i%2===0){const l=new THREE.PointLight(0xff9a40,.9,7,2);l.position.set(x,2.1,z);scene.add(l);candles.push({flame,light:l,seed:Math.random()*10})}
  else candles.push({flame,light:null,seed:Math.random()*10});
}

/* ---------- floating dust motes / gold leaf ---------- */
const N=500;const pg=new THREE.BufferGeometry();const pos=new Float32Array(N*3);const spd=new Float32Array(N);
for(let i=0;i<N;i++){const r=Math.random()*15,a=Math.random()*7;pos[i*3]=Math.cos(a)*r;pos[i*3+1]=Math.random()*10;pos[i*3+2]=Math.sin(a)*r;spd[i]=.1+Math.random()*.3}
pg.setAttribute('position',new THREE.BufferAttribute(pos,3));
const motes=new THREE.Points(pg,new THREE.PointsMaterial({color:0xf0d68a,size:.07,transparent:true,opacity:.7,depthWrite:false,blending:THREE.AdditiveBlending}));
scene.add(motes);

/* ============================ CONTROLS ============================ */
let yaw=0,targetYaw=0,pitch=-.05,targetPitch=-.05;
let dragging=false,lx=0,ly=0,moved=0;
let radius=11,targetRadius=11,wander=0;
const raycaster=new THREE.Raycaster(),mouse=new THREE.Vector2();
let focusIndex=-1;

renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;lx=e.clientX;ly=e.clientY;moved=0});
addEventListener('pointerup',e=>{
  if(dragging&&moved<6&&e.target===renderer.domElement)pick(e);
  dragging=false;
});
addEventListener('pointermove',e=>{
  mouse.x=(e.clientX/innerWidth)*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;
  if(dragging){
    const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);
    targetYaw-=dx*.005;targetPitch=Math.max(-.5,Math.min(.8,targetPitch-dy*.003));
    focusIndex=-1;syncNav();
  }
});
addEventListener('wheel',e=>{
  if(document.getElementById('panel').classList.contains('open'))return;
  targetYaw+=e.deltaY*.0012;focusIndex=-1;syncNav();
},{passive:true});
addEventListener('keydown',e=>{
  if(e.key==='Escape')closePanel();
  if(e.key==='ArrowLeft'){targetYaw-=.2;focusIndex=-1;syncNav()}
  if(e.key==='ArrowRight'){targetYaw+=.2;focusIndex=-1;syncNav()}
});

function pick(e){
  raycaster.setFromCamera(mouse,camera);
  const hits=raycaster.intersectObjects(paintings.map(p=>p.art));
  if(hits.length)openSection(hits[0].object.userData.sectionIndex);
}
function nearestYaw(target){ // shortest rotation
  let d=((target-targetYaw+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;return targetYaw+d;
}
function focus(i){
  focusIndex=i;targetYaw=nearestYaw(paintings[i].angle);targetPitch=-.02;targetRadius=5.2;syncNav();
}
function unfocus(){targetRadius=11}

/* ============================ UI ============================ */
const nav=document.getElementById('nav');
SECTIONS.forEach((s,i)=>{
  const b=document.createElement('button');b.textContent=s.label;b.onclick=()=>{focus(i);setTimeout(()=>openSection(i),900)};nav.appendChild(b);
});
const home=document.createElement('button');home.textContent='Atrium';home.onclick=()=>{focusIndex=-1;targetRadius=11;targetPitch=-.05;syncNav()};nav.prepend(home);
function syncNav(){[...nav.children].forEach((b,idx)=>b.classList.toggle('active',idx===focusIndex+1))}
syncNav();

const panel=document.getElementById('panel'),scrollEl=document.getElementById('scroll');
function openSection(i){
  const s=SECTIONS[i];if(focusIndex!==i)focus(i);
  scrollEl.innerHTML=`<button class="close" onclick="closePanel()" aria-label="Close">✕</button>
    <h2>${s.title}</h2><div class="sub">${s.sub}</div>${s.html.replace('%%PORTRAIT%%',PORTRAIT_SRC)}`;
  panel.classList.add('open');
}
function closePanel(){panel.classList.remove('open')}
panel.addEventListener('click',e=>{if(e.target===panel)closePanel()});
window.closePanel=closePanel;

/* ============================ LOOP ============================ */
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();

  // idle drift when nothing focused & not dragging
  if(!dragging&&focusIndex===-1&&!panel.classList.contains('open'))targetYaw+=.0007;

  yaw+=(targetYaw-yaw)*.06;pitch+=(targetPitch-pitch)*.06;radius+=(targetRadius-radius)*.05;

  // camera rig: sits on a small circle, looks outward at the painting ring
  const dist = focusIndex>=0 ? (R_FRAME - 5.2) : 3.2;
  camera.position.set(Math.sin(yaw)*dist, 2.8 - pitch*2, -Math.cos(yaw)*dist);
  const look=new THREE.Vector3(Math.sin(yaw)*R_FRAME, 2.8 + Math.sin(pitch)*6, -Math.cos(yaw)*R_FRAME);
  camera.lookAt(look);

  // centrepiece
  armillary.rotation.y=t*.35;
  rings.forEach((r,i)=>{r.rotation.x+=.003*(i+1);r.rotation.z+=.002*(i%2?1:-1)});
  vit.rotation.y=-t*.5;
  core.rotation.y=t*.8;core.rotation.x=t*.5;
  armillary.position.y=3.2+Math.sin(t*1.2)*.12;
  coreLight.intensity=2.1+Math.sin(t*3)*.25;

  // candles
  candles.forEach(c=>{
    const f=.9+Math.sin(t*9+c.seed)*.08+Math.sin(t*17+c.seed*2)*.05;
    c.flame.scale.set(f,1.8*f,f);
    if(c.light)c.light.intensity=.8+Math.sin(t*11+c.seed)*.25;
  });

  // paintings gentle sway + hover glow
  raycaster.setFromCamera(mouse,camera);
  const hov=raycaster.intersectObjects(paintings.map(p=>p.art));
  renderer.domElement.style.cursor=hov.length?'pointer':(dragging?'grabbing':'grab');
  paintings.forEach((p,i)=>{
    p.grp.position.y=p.baseY+Math.sin(t*.8+i)*.06;
    const hovered=hov.length&&hov[0].object===p.art;
    p.art.material.emissive=p.art.material.emissive||new THREE.Color();
    p.art.material.emissive.setRGB(hovered?.25:0,hovered?.18:0,hovered?.06:0);
    p.art.material.emissiveMap=p.art.material.map;
  });

  // motes
  const arr=pg.attributes.position.array;
  for(let i=0;i<N;i++){arr[i*3+1]+=spd[i]*.01;arr[i*3]+=Math.sin(t+i)*.0008;if(arr[i*3+1]>10)arr[i*3+1]=0}
  pg.attributes.position.needsUpdate=true;

  renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
window.addEventListener('load',()=>setTimeout(()=>document.getElementById('loader').classList.add('hide'),600));
</script>
</body>
</html>
